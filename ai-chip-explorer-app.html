const setT=()=>{const i=sel!=null;LT.ihs=ex?4.4:i?2.6:0;LT.tim=ex?2.8:i?1.2:0;LT.dice=ex?1.3:0;LT.ball=ex?-1.2:0;OT.ihs=sel==null?(ex?.6:1):(sel=="ihs"||sel=="tim"?1:.12);OT.tim=sel==null?(ex?.9:1):sel=="tim"?1:sel=="ihs"?.5:0};
function tgt(id){const d=LT.dice+.3;if(id=="ihs")return[0,LT.ihs+.4,0,8.5];if(id=="tim")return[.1,LT.tim+.3,0,8.5];if(id=="mem")return[1.35,d,0,6.5];if(id=="sub")return[0,.1,0,9.5,1.3];if(id=="die")return[-.55,d,0,7.5];const r=RG[id];if(r)return[-.55+(r[0]+r[2]/2-.5)*2.1,d,(r[1]+r[3]/2-.5)*2.3,5.5];return[0,.3+(ex?.6:0),0,14]}
function fly(id){const t=tgt(id);tgT.set(t[0],t[1],t[2]);rdT=t[3];phT=t[4]||(RG[id]?.85:1.05)}
function paint(){for(const k in MT)MT[k].forEach(m=>{if(m.emissive){const on=sel==k;m.emissive.setHex(on?parseInt(D[k][3].slice(1),16):0);m.emissiveIntensity=on?.35:0}})}
function setSel(id){sel=id;auto=false;setT();paint();drawDie();[...$("ls").children].forEach(b=>{const o=b.dataset.k==id;b.classList.toggle("on",o);o?b.setAttribute("aria-current","true"):b.removeAttribute("aria-current")});info(id);fly(id)}
function reset(){sel=null;ex=false;$("ex").classList.remove("on");auto=!matchMedia("(prefers-reduced-motion:reduce)").matches;setT();paint();drawDie();[...$("ls").children].forEach(b=>b.classList.remove("on"));info(null);fly(null)}
$("ls").onclick=e=>{const b=e.target.closest("button");if(b)setSel(b.dataset.k)};$("rs").onclick=reset;
$("ex").onclick=()=>{ex=!ex;$("ex").classList.toggle("on",ex);auto=false;setT();fly(sel)};
// ---------- Điều khiển ----------
const ptr=new Map(),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),rc=new T.Raycaster();let mv=0,pd=0;
const dist=()=>{const p=[...ptr.values()];return Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])||1};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);mv=0;if(ptr.size==2)pd=dist();auto=false};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);mv+=Math.abs(dx)+Math.abs(dy);if(ptr.size==1){th-=dx*.008;ph=phT=cl(ph-dy*.008,.15,2.2)}else{const d=dist();rdT=cl(rdT*pd/d,4,18);pd=d}};
cv.onpointerup=e=>{const one=ptr.size==1&&mv<6;ptr.delete(e.pointerId);if(!one)return;const r=cv.getBoundingClientRect();rc.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
const h=rc.intersectObjects(PK,false).find(h=>h.object.visible&&(h.object.material.opacity??1)>.5);if(!h)return;let id=h.object.userData.id;
if(id=="dt"){const u=h.uv.x,v=1-h.uv.y;id="die";for(const k in RG){const r=RG[k];if(u>=r[0]&&u<=r[0]+r[2]&&v>=r[1]&&v<=r[1]+r[3]){id=k;break}}}
if(sel==null&&id=="ihs")id="ov";setSel(id)};
cv.onpointercancel=e=>ptr.delete(e.pointerId);
cv.onwheel=e=>{e.preventDefault();auto=false;rdT=cl(rdT*(1+e.deltaY*.001),4,18)};
new ResizeObserver(()=>{const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(cv);
(function loop(){requestAnimationFrame(loop);for(const k in L)L[k]+=(LT[k]-L[k])*.09;ihsG.position.y=L.ihs;timG.position.y=L.tim;diceG.position.y=L.dice;ballG.position.y=L.ball;
for(const[k,g]of[["ihs",ihsG],["tim",timG]]){OP[k]+=(OT[k]-OP[k])*.12;MT[k].forEach(m=>{m.opacity=OP[k];m.transparent=true;m.depthWrite=OP[k]>.9});g.visible=OP[k]>.02}
if(auto)th+=.004;tg.lerp(tgT,.08);rd+=(rdT-rd)*.08;ph+=(phT-ph)*.08;
cam.position.set(tg.x+rd*Math.sin(ph)*Math.sin(th),tg.y+rd*Math.cos(ph),tg.z+rd*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);R.render(S,cam)})();
</script></body></html>
